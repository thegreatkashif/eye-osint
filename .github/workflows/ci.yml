name: EYE CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: postgresql+psycopg://eye:ci-only-password@127.0.0.1:5432/eye
      EYE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify application imports
        run: python -c "from app.main import app; print('EYE application import successful')"

      - name: Run tests
        run: python -m pytest -q
